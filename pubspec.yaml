name: spice_route
description: "Spice Route — Premium Hybrid Restaurant Ordering System"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Routing ───────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── UI / Fonts ────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  responsive_builder: ^0.7.0
  flutter_animate: ^4.5.2      # Declarative animations (splash, transitions)
  pinput: ^5.0.0  
  lottie: ^3.1.2
  cached_network_image: ^3.3.1             # Premium OTP input boxes (Phase 1)
  fl_chart: ^0.69.0
  # ── Phase 2 – Maps / Location / Payments ─────────────────────────────────
  google_maps_flutter: ^2.6.1   # Uncomment in Phase 2
  geolocator: ^12.0.0           # Uncomment in Phase 2
  permission_handler: ^11.3.1   # Uncomment in Phase 2
  mobile_scanner: ^5.1.1        # QR scanner for Dine-In mode – Phase 2
  razorpay_flutter: ^1.3.7      # Uncomment in Phase 2

  # ── Phase 3 – AI Chat ─────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1    # Uncomment in Phase 3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: any
  riverpod_generator: any
  custom_lint: any
  riverpod_lint: any
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/         # route.png 
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/route.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/route.png"